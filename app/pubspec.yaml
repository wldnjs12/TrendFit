name: trendfit
description: "TrendFit - 트렌드를 내 옷장으로 번역해주는 AI 스타일리스트 앱"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1        # 백엔드 REST API 호출
  provider: ^6.1.2     # 취향 프로필 / 옷장 상태 관리
  image_picker: ^1.1.2  # 옷장 등록 시 사진 선택 (모바일+웹 공용)
  google_fonts: ^6.2.1  # Figma 디자인 서체(Syne, Plus Jakarta Sans, Noto Sans KR) 적용
  google_sign_in: ^6.2.1 # Google OAuth2 로그인 (conventions.md §4)
  shared_preferences: ^2.3.2 # 로그인 세션(JWT) 로컬 영속화
  geolocator: ^13.0.2 # 추천 요청 시 날씨 조회용 위치(위경도) 자동 감지
  flutter_animate: ^4.5.0 # 화면 전환/진입/탭 피드백 애니메이션
  url_launcher: ^6.3.1 # 트렌드 기사 원문 / 네이버쇼핑 구매 링크 외부 브라우저로 열기
  share_plus: ^12.0.2 # 위클리 리포트 이미지 저장/공유 (모바일 경로, 웹은 dart:html 다운로드)
  cached_network_image: ^3.4.1 # 옷 사진 디스크 캐싱 — 백엔드가 이미지에 immutable 캐시 헤더를
    # 주므로(ImageController), 화면을 오갈 때마다 같은 사진을 재다운로드하지 않게 한다

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
