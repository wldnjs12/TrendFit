server:
  # Railway 등 PaaS는 리슨할 포트를 PORT 환경변수로 주입한다. 로컬 개발은 기본값 8080을 쓴다.
  port: ${PORT:8080}

spring:
  application:
    name: trendfit

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    # 배포 환경(Railway 등)에서는 DB_URL을 해당 플랫폼이 제공하는 MySQL 접속 정보로 덮어쓴다.
    # 예: jdbc:mysql://<host>:<port>/<database>?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: ${DB_URL:jdbc:mysql://localhost:3306/trendfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:trendfit}
    password: ${DB_PASSWORD:trendfit}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 외부 연동 설정. 실제 키는 backend/.env 파일(gitignore 처리됨, spring-dotenv가 부팅 시
# 자동으로 읽어 환경변수로 주입)에 넣어 관리한다. backend/.env.example 참고.
trendfit:
  security:
    jwt:
      # JWT 서명 비밀키. 로컬 개발 기본값이 있지만, 배포 환경에서는 반드시 TRENDFIT_PASSWORD
      # 환경변수(.env)로 32바이트 이상의 값을 주입한다 (conventions.md §4 — Google OAuth2
      # 로그인 + JWT 세션 결정). 참고: 구글 로그인 자체(액세스 토큰 검증)에는 별도 시크릿이
      # 필요 없다 — 이 값은 우리 서버가 발급하는 JWT 서명 전용이다.
      secret: ${TRENDFIT_PASSWORD:trendfit-local-dev-only-jwt-secret-please-override-in-production}
      access-token-validity-ms: 1800000    # 30분
      refresh-token-validity-ms: 1209600000 # 14일
    google:
      # Google Cloud Console에서 발급받은 OAuth 2.0 "웹 애플리케이션" 클라이언트 ID(비밀값 아님).
      # 프론트(app/lib/config/app_config.dart의 googleWebClientId, app/web/index.html의
      # google-signin-client_id meta 태그)와 동일한 클라이언트 ID를 가리킨다.
      client-id: ${TRENDFIT_ID:406450564519-1bpdop9rh4s3dfiud5fst2fqs39o4d9p.apps.googleusercontent.com}
  ai:
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: claude-sonnet-5
  weather:
    # 공공데이터포털 기상청 단기예보조회(getVilageFcst) 서비스키 — "인코딩(Encoding)" 버전 사용
    # (A3, 2026-07-27 결정). WeatherClient가 쿼리스트링을 직접 조립하므로 "디코딩" 키를 넣으면
    # 이중 인코딩으로 401이 난다.
    api-key: ${WEATHER_API_KEY:}
  naver-shopping:
    # 네이버 개발자센터(developers.naver.com) Application 등록 > "검색" API 사용 설정으로 발급
    # (A6, 2026-07-29 결정). 미설정이어도 '+1 아이템'은 상품 링크 없이 정상 동작한다.
    client-id: ${NAVER_SHOPPING_CLIENT_ID:}
    client-secret: ${NAVER_SHOPPING_CLIENT_SECRET:}
  trend-batch:
    cron: "0 0 3 * * *"   # 매일 새벽 3시 트렌드 수집 배치 실행
    sources:               # service-policy.md §3 확정 소스 (2026-07-27)
      - https://www.vogue.co.kr/feed/
      - https://www.wkorea.com/feed/
      - https://hypebeast.kr/feed
  storage:
    # local(기본값, 로컬 파일시스템) 또는 r2(Cloudflare R2). 배포 환경(Railway)은 재배포마다
    # 파일시스템이 초기화되므로 r2로 설정해야 한다 (A4, 2026-07-27 결정).
    provider: ${STORAGE_PROVIDER:local}
    local:
      base-dir: ./storage/images
    r2:
      # Cloudflare 대시보드 R2 > Manage API Tokens에서 발급. provider=r2일 때만 쓰인다.
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
  cors:
    # Flutter Web(별도 오리진, architecture.md §4 — 프론트 Vercel/백엔드 Render·Railway)이
    # 브라우저에서 REST 호출을 하려면 CORS 허용이 필요하다. 로컬 개발 기본값 + 배포 도메인은
    # 환경변수로 주입한다(콤마 구분).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8765,http://localhost:3000,http://localhost:5000}
