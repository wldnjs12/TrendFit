server:
  port: 8080

spring:
  application:
    name: trendfit

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mysql://localhost:3306/trendfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:trendfit}
    password: ${DB_PASSWORD:trendfit}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 외부 연동 설정 (실제 키는 application-local.yml 또는 환경변수로 분리하고 커밋하지 않습니다)
trendfit:
  ai:
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: claude-sonnet-5
  weather:
    api-key: ${WEATHER_API_KEY:}
  trend-batch:
    cron: "0 0 3 * * *"   # 매일 새벽 3시 트렌드 수집 배치 실행
    sources:               # service-policy.md §3 확정 소스 (2026-07-27)
      - https://www.vogue.co.kr/feed/
      - https://www.wkorea.com/feed/
      - https://hypebeast.kr/feed
  storage:
    local:
      # 로컬 개발 전용. 배포 전 클라우드 구현체(Cloudflare R2 등)로 교체한다 (A4, 2026-07-27 결정)
      base-dir: ./storage/images
