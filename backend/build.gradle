plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.trendfit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web / API
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 인증: Google OAuth2 로그인 + JWT 세션 (conventions.md §4 결정)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// backend/.env 파일을 부팅 시 자동으로 읽어 환경변수로 주입 (커밋 금지 — .gitignore 처리됨)
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// 이미지 스토리지: Cloudflare R2(S3 호환 API) — global.storage.R2ImageStorage (A4 결정)
	implementation 'software.amazon.awssdk:s3:2.46.7'
	// awssdk apache5-client가 요구하는 버전(httpclient5 5.6.1, TlsSocketStrategy 포함;
	// httpcore5 5.4, DefaultHttpRequestWriterFactory(Http1Config) 포함)이 Spring Boot의
	// 의존성 관리(각각 5.3.1 / 5.2.4)에 의해 강제 다운그레이드되어 런타임 에러가 나던 문제 수정.
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.1'
	implementation 'org.apache.httpcomponents.core5:httpcore5:5.4'
	implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4'

	// 트렌드 수집: RSS/Atom 파싱 (PRD 4.2 F1)
	implementation 'com.rometools:rome:2.1.0'

	// Claude API 클라이언트 (global.config.ClaudeClientConfig, 트렌드 정제·추천 엔진에서 공용)
	implementation 'com.anthropic:anthropic-java:2.52.0'

	// Scheduling is included in spring-context (already transitively available via spring-boot-starter)

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Dev tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
